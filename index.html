  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Gurdwara Discovery — Prototype V1.3.4</title>
  <link rel="manifest" href="manifest.json?v=1.3.4&build=2026-08-27-index-refresh" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=1.3.4&build=2026-08-27-index-refresh" />
</head>
<body>
  <main id="app" class="app-shell"></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  
  <script>
  (() => {
    const PAGE_BUILD = "2026-08-27-index-refresh";
    const PAGE_VERSION = "1.3.4";
    const CHECK_KEY = "gurdwara_last_build_check";
    const now = Date.now();

    async function checkForNewBuild() {
      try {
        // Timestamp + no-store prevents browser/CDN from reusing old build-info.json.
        const res = await fetch("build-info.json?t=" + now, {
          cache: "no-store",
          headers: { "Cache-Control": "no-cache, no-store, must-revalidate" }
        });
        if (!res.ok) return;
        const info = await res.json();

        if (info && info.build && info.build !== PAGE_BUILD) {
          // Reload the HTML itself with the new build in the URL.
          // This bypasses a stale cached index.html.
          const u = new URL(window.location.href);
          u.searchParams.set("build", info.build);
          u.searchParams.set("v", info.version || "");
          window.location.replace(u.toString());
          return;
        }

        localStorage.setItem(CHECK_KEY, String(now));
      } catch (e) {
        // App still works offline or if the check fails.
      }
    }

    // Check immediately on load, then periodically while the tab stays open.
    checkForNewBuild();
    setInterval(checkForNewBuild, 60000);
  })();
  </script>

  <script src="data.js?v=1.3.4&build=2026-08-27-index-refresh"></script>
  <script src="app.js?v=1.3.4&build=2026-08-27-index-refresh"></script>

  <div id="build-version" style="position:fixed;right:8px;bottom:6px;font:11px/1.2 system-ui,sans-serif;color:#7a7468;background:rgba(255,255,255,.86);padding:4px 7px;border:1px solid #ded8cb;border-radius:999px;z-index:9999;">
    v1.3.4 · 2026-08-27-index-refresh</div>

</body>
